[pytest]
asyncio_mode = auto
testpaths = tests
# --timeout: no test in this suite takes more than ~1s; the worst seen on the
# slowest CI runner observed was 4.5s. 60s is therefore pure headroom, and a
# test that reaches it is hung, not slow. pytest-timeout raises inside the
# test, so the run continues and the report names the offender with a
# traceback — instead of the runner killing the whole job and GitHub reporting
# it as an unreadable `cancelled` (#273).
addopts = -p no:anyio --timeout=60
