name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Stays at 10. The suite now runs in ~1 min of the job's ~2 min, and the
    # pytest --session-timeout below fires at 7 min, so this ceiling should
    # never be what stops the job again — it is the backstop behind the
    # backstop. Raising it was the one fix #273 ruled out: the job was not
    # short of time, it was doing several times more disk work than it needed.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: practice_user
          POSTGRES_PASSWORD: practice_pass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The data directory lives on tmpfs. This database exists for the
        # length of one job and is thrown away, so durability buys nothing —
        # and the suite is fsync-bound: every test empties the tables it
        # dirtied, which rewrites relfilenodes the checkpointer then has to
        # sync. On a slow-disk runner that load is what stretched a 3-minute
        # job past its 10-minute ceiling (#273); on tmpfs it costs nothing and
        # the job stops depending on which runner it landed on.
        #
        # No size is set, so the mount defaults to half of the runner's RAM
        # (~8GB) and only occupies what it actually uses — a few hundred MB.
        #
        # pg_isready defaults its database name to the user name, so without
        # -d it logged `FATAL: database "practice_user" does not exist` every
        # 10s. The check passed regardless (the server answered), but it
        # buried the postgres log that diagnosing #273 depended on.
        options: >-
          --health-cmd "pg_isready -U practice_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          TEST_BASE_DB_URL: postgresql+asyncpg://practice_user:practice_pass@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql+asyncpg://practice_user:practice_pass@localhost:5432/practice_journal_test
        # --session-timeout is the job's real deadline, deliberately set below
        # timeout-minutes so pytest — not the runner — is what reports a
        # blown budget. The runner kills the job silently and GitHub calls
        # that `cancelled`; pytest exits with a message, the test counts so
        # far, and a nonzero status that reads as the failure it is. The
        # per-test --timeout lives in pytest.ini so local runs get it too.
        run: python -m pytest tests/ -v --session-timeout=420

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `next build` type-checks app code but not test files, so a PR could
      # widen a shared interface, leave every existing fixture ill-typed, and
      # still go green — which happened three times in one batch (#293).
      # Vitest doesn't catch it either: it transpiles without type-checking.
      # `tsc --noEmit` covers everything tsconfig includes, tests included.
      #
      # First step after install because it's the cheapest gate here (~6s
      # locally, against 40s for the tests and 36s for the build in CI) and
      # because a type error reported on its own is easier to read than the
      # same error buried in build output.
      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Vitest never compiles the production bundle, so build-only breakage —
      # a prerender error, a server/client boundary mistake, an invalid
      # rewrite — used to reach Railway before anyone saw it: `next build`
      # only ran in the Dockerfile's `builder` stage, i.e. at deploy time.
      #
      # The two vars below are required for the build to get that far, and
      # neither is a credential. NEXT_PUBLIC_API_URL is interpolated into the
      # rewrite destination in next.config.js, which Next rejects at startup
      # unless it's absolute or starts with "/". The Clerk key is a synthetic
      # publishable key (base64 of "example.clerk.accounts.dev$"): the root
      # layout's <ClerkProvider> throws "Missing publishableKey" while
      # prerendering without one. Publishable keys are inlined into the client
      # bundle by design and this one points at nothing; no CLERK_SECRET_KEY
      # is needed, and none should be added — the build must not depend on a
      # real Clerk instance.
      #
      # Two side effects worth knowing about:
      #   - `next build` runs ESLint and type-checks (next.config.js sets
      #     neither `eslint.ignoreDuringBuilds` nor
      #     `typescript.ignoreBuildErrors`), so this step is also the first
      #     lint/tsc gate CI has ever had. A lint error now fails the build.
      #   - It runs on the root .nvmrc's Node (22.x), while the deploy build
      #     is pinned to node:20.20.2-alpine in frontend/Dockerfile. So this
      #     narrows the deploy-time-surprise window without closing it —
      #     Node-20-specific breakage still reaches Railway first. Deciding
      #     that pin is #260; matching CI to it here would only entrench an
      #     EOL runtime ahead of that decision.
      - name: Build (production)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run build
