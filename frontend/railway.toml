[build]
# Pass NEXT_PUBLIC_* env vars as Docker build args so they're available
# at Next.js build time for static optimization. Railway injects these
# from the service's environment variables automatically when listed here.
dockerfilePath = "Dockerfile"

[build.args]
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "${{NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "${{NEXT_PUBLIC_CLERK_SIGN_IN_URL}}"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "${{NEXT_PUBLIC_CLERK_SIGN_UP_URL}}"
NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL = "${{NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL}}"
NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL = "${{NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL}}"
NEXT_PUBLIC_API_URL = "${{NEXT_PUBLIC_API_URL}}"
# Optional: set NEXT_PUBLIC_PREVIEW_ENABLED=1 in Railway env vars to expose
# the dev /preview route on this deploy. Omit it on real prod environments —
# the page will redirect to /today via NODE_ENV gating in preview/page.tsx.
NEXT_PUBLIC_PREVIEW_ENABLED = "${{NEXT_PUBLIC_PREVIEW_ENABLED}}"

[deploy]
healthcheckPath = "/sign-in"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
